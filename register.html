<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Sankalpa 1.0 – Tech Fest</title>
  <link rel="icon" type="image/png" href="assets2/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700;800;900&family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Base */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #000000; --white: #ffffff; --cream: #F0EAD6;
      --orange: #FF5500; --red: #C0102E; --blue-glow: #1A3875;
      --nav-h: 62px;
    }
    body {
      background: #000; color: #fff; font-family: 'Inter', sans-serif;
      overflow-x: hidden; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }

    /* Iconic Blue Frame Glow */
    body::before {
      content: ''; position: fixed; inset: 0;
      box-shadow: inset 0 0 0 2px #1A3875, inset 0 0 50px rgba(26, 56, 117, 0.25);
      z-index: 9999; pointer-events: none;
    }

    /* Navbar Simple */
    #navbar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      z-index: 1000;
    }
    .nav-logo-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .nav-logo-img {
      height: 38px; width: auto; object-fit: contain; mix-blend-mode: lighten;
      filter: drop-shadow(0 0 10px rgba(255, 85, 0, 0.5));
    }
    .back-btn {
      position: absolute; left: 20px; color: rgba(255, 255, 255, 0.7);
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em;
      font-weight: 600; display: flex; align-items: center; gap: 6px;
      transition: color 0.3s;
    }
    .back-btn:hover { color: var(--orange); }

    /* Main Container */
    main {
      flex: 1; padding: 100px 20px 60px;
      display: flex; justify-content: center; align-items: center;
      position: relative;
    }
    .bg-overlay {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at top right, rgba(255, 85, 0, 0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at bottom left, rgba(26, 56, 117, 0.3) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* Form Card */
    .form-wrapper {
      background: rgba(10, 12, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 50px; width: 100%; max-width: 600px;
      position: relative; z-index: 1;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: formFadeIn 0.8s ease backwards;
    }
    @keyframes formFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-header { text-align: center; margin-bottom: 40px; }
    .form-title {
      font-family: 'Playfair Display', serif;
      font-weight: 800; font-size: clamp(32px, 5vw, 48px);
      color: var(--cream); line-height: 1.1; margin-bottom: 8px;
    }
    .form-subtitle {
      font-size: 14px; font-weight: 400; color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.05em;
    }

    /* Input Groups */
    .input-group { position: relative; margin-bottom: 28px; }
    .input-group label {
      position: absolute; top: 50%; left: 16px; transform: translateY(-50%);
      font-size: 14px; color: rgba(255, 255, 255, 0.5);
      pointer-events: none; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.02em; font-weight: 500;
      background: transparent; padding: 0 4px;
    }
    .input-field {
      width: 100%; background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px;
      padding: 16px; color: #fff; font-family: 'Inter', sans-serif;
      font-size: 15px; outline: none; transition: all 0.3s ease;
    }
    .input-field:focus,
    .input-field:not(:placeholder-shown) {
      border-color: rgba(255, 85, 0, 0.6);
      box-shadow: 0 0 0 3px rgba(255, 85, 0, 0.1);
      background: rgba(0, 0, 0, 0.6);
    }
    .input-field:focus + label,
    .input-field:not(:placeholder-shown) + label,
    .input-field.has-val + label {
      top: 0; font-size: 11px; color: var(--orange);
      background: #0a0c14; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      border-radius: 4px;
    }

    /* Select Dropdown */
    select.input-field {
      appearance: none; cursor: pointer;
    }
    select.input-field option {
      background: #0a0c14; color: #fff; font-size: 15px;
    }
    .select-icon {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      pointer-events: none;
    }
    .select-icon svg { width: 16px; height: 16px; fill: rgba(255,255,255,0.5); }
    
    /* Submit Button */
    .submit-btn {
      width: 100%; padding: 18px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, var(--orange) 0%, #D44700 100%);
      color: #fff; font-family: 'Inter', sans-serif; font-size: 14px;
      font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
      position: relative; overflow: hidden; box-shadow: 0 8px 24px rgba(255, 85, 0, 0.3);
    }
    .submit-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: all 0.5s ease;
    }
    .submit-btn:hover::before { left: 100%; }
    .submit-btn:hover {
      transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255, 85, 0, 0.4);
    }

    /* Success Message */
    #success-msg {
      display: none; text-align: center; padding: 40px 20px;
    }
    .success-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(76, 175, 80, 0.1); border: 2px solid #4CAF50;
      color: #4CAF50; font-size: 32px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }

    @media (max-width: 640px) {
      .form-wrapper { padding: 30px 20px; }
      .form-title { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>

  <!-- Navbar -->
  <nav id="navbar">
    <a href="index.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back
    </a>
    <a href="index.html" class="nav-logo-wrap">
      <img src="assets2/logo.png" alt="Sankalpa Logo" class="nav-logo-img">
    </a>
  </nav>

  <main>
    <div class="form-wrapper" id="form-wrapper">
      <div class="form-header">
        <h1 class="form-title">Join Sankalpa</h1>
        <p class="form-subtitle">Complete the form below to register.</p>
      </div>

      <form id="register-form" action="https://script.google.com/macros/s/AKfycbw39v4bLk6AjIX-JJhAAJXKYdXUxAICk4WpzqyjsOdMQp3Z1TZknqkk2J_6JTEUYdTN/exec" method="post">
        <div class="input-group">
          <input type="text" id="fullname" name="fullname" class="input-field" placeholder=" " required>
          <label for="fullname">Full Name</label>
        </div>

        <div class="input-group">
          <input type="email" id="email" name="email" class="input-field" placeholder=" " required>
          <label for="email">Email Address</label>
        </div>

        <div class="input-group">
          <input type="tel" id="phone" name="phone" class="input-field" placeholder=" " required>
          <label for="phone">Phone Number</label>
        </div>

        <div class="input-group">
          <input type="text" id="college" name="college" class="input-field" placeholder=" " required>
          <label for="college">College / Institution Name</label>
        </div>

        <div class="input-group">
          <select id="event" name="event" class="input-field" required onchange="this.classList.add('has-val')">
            <option value="" disabled selected></option>
            <option value="synapse_hackathon">Synapse Hackathon (AI & ML)</option>
            <option value="robo_wars">Robo-Wars Arena (Robotics)</option>
            <option value="datathon">Datathon Challenge (Data Science)</option>
            <option value="maze_runner">Line Follower & Maze (Robotics)</option>
            <option value="paper_colloquium">Paper Colloquium (Research)</option>
            <option value="speed_coding">Speed Programming (Coding)</option>
            <option value="llm_workshop">Fine-Tuning LLMs (Workshop)</option>
            <option value="ros2_drones">ROS2 & Autonomous Drones (Workshop)</option>
          </select>
          <label for="event">Select Event</label>
          <div class="select-icon">
            <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </div>
        </div>

        <button type="submit" class="submit-btn">Submit Registration</button>
      </form>
    </div>

    <div class="form-wrapper" id="success-msg" role="status" aria-live="polite">
      <div class="success-icon">✓</div>
      <h1 class="form-title">Registration Successful</h1>
      <p class="form-subtitle">Thank you for registering. Your response has been received.</p>
      <a href="index.html" class="submit-btn" style="display: inline-block; text-align: center; margin-top: 30px;">Return to Home</a>
    </div>
  </main>

  <script>
    const registerForm = document.getElementById('register-form');
    registerForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const submitButton = registerForm.querySelector('[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Submitting...';

      try {
        const response = await fetch(registerForm.action, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams(new FormData(registerForm))
        });

        if (response.type !== 'opaque' && !response.ok) {
          throw new Error('Registration request failed');
        }

        document.getElementById('form-wrapper').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) {
        console.error('Registration submission failed:', error);
        submitButton.disabled = false;
        submitButton.textContent = 'Try Again';
        alert('The registration could not be submitted. Please check your connection and try again.');
      }
    });

    // Handle select value state for floating label
    const selectEl = document.getElementById('event');
    if (selectEl.value !== "") {
      selectEl.classList.add('has-val');
    }
  </script>
</body>
</html>
